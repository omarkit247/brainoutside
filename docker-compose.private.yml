# Coolify parses this file during builds without runtime-only variables.
# Empty password fallback permits parsing only; PostgreSQL refuses initial
# startup without a real runtime password. Do not enable trust authentication.
# Private BrainOutside deployment: access through an SSH tunnel.
# Do not attach a public domain to this resource.
# Back up brain-state together with PostgreSQL; it contains encryption keys.
# Git credentials are configured in the setup wizard and stored encrypted.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 60s
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:-}@postgres:5432/brain
    REDIS_URL: redis://redis:6379/0
    BRAIN_REPO_DIR: /data/brain-repo
    BRAIN_VIEWS_DIR: /data/brain-views
    BRAIN_STATE_DIR: /data/state
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
    SECURE_SSL_REDIRECT_ENABLED: ${SECURE_SSL_REDIRECT_ENABLED:-0}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:18080}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:18080}
  volumes:
    - brain-repo:/data/brain-repo
    - brain-views:/data/brain-views
    - brain-state:/data/state
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: [web]
    ports:
      - "127.0.0.1:18080:8000"
    labels:
      - "traefik.enable=false"
    environment:
      <<: *app-env
      MCP_LOOPBACK_HOST: mcp
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  mcp:
    <<: *app
    command: [mcp]
    environment:
      <<: *app-env
      MCP_LOOPBACK_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  worker:
    <<: *app
    command: [worker]
    environment:
      <<: *app-env
      MCP_LOOPBACK_HOST: mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brain-repo:
  brain-views:
  brain-state:
  pgdata:
  redisdata:
